name: Update Knowledge Graph

on:
  workflow_dispatch: # manual "Run workflow" button, to run it without a code change
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'next.config.ts'
      - 'scripts/graph-mermaid.mjs'

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install graphify
        run: pip install graphifyy

      - name: Update graph
        run: graphify update .

      # The README shows a small Mermaid diagram of the code folders. GitHub draws it, so there is no image file.
      - name: Write the diagram into README.md
        run: node scripts/graph-mermaid.mjs graphify-out/graph.json README.md

      - name: Commit updated diagram
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # graphify-out/ is in .gitignore on purpose (local cache), so only README.md is committed.
          git add README.md
          if git diff --cached --quiet; then
            echo "No diagram changes."
          else
            git commit -m "chore: update knowledge graph diagram [skip ci]"
            git push
          fi
