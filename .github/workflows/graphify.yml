name: Update Knowledge Graph

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'next.config.ts'

jobs:
  update-graph:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install graphify
        run: pip install "graphifyy[svg]"

      - name: Update graph
        run: graphify update .

      - name: Export SVG
        run: |
          python -c "
          import json
          from pathlib import Path
          import networkx as nx
          from graphify.export import to_svg

          data = json.loads(Path('graphify-out/graph.json').read_text())
          G = nx.Graph()
          for node in data.get('nodes', []):
              attrs = {k: v for k, v in node.items() if k != 'id'}
              if 'label' not in attrs:
                  attrs['label'] = node['id']
              G.add_node(node['id'], **attrs)
          for edge in data.get('links', []):
              G.add_edge(edge['source'], edge['target'])

          communities = {}
          labels = {}
          analysis_path = Path('graphify-out/.graphify_analysis.json')
          if analysis_path.exists():
              analysis = json.loads(analysis_path.read_text())
              for k, v in analysis.get('communities', {}).items():
                  communities[int(k)] = v
                  labels[int(k)] = f'Community {k}'

          to_svg(G, communities, 'docs/graph.svg', community_labels=labels, figsize=(20, 14))
          print(f'SVG: {G.number_of_nodes()} nodes, {G.number_of_edges()} edges')
          "

      - name: Commit updated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/graph.svg graphify-out/
          if git diff --cached --quiet; then
            echo "No graph changes."
          else
            git commit -m "chore: update knowledge graph SVG [skip ci]"
            git push
          fi
